name: Clicker
options:
  bundleIdPrefix: derekwelty
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

# Both targets build the same sources. Platform differences are #if os(...) blocks and
# Clicker/UI/Platform.swift. Signing comes from Signing.xcconfig and an optional development seed from
# Local.xcconfig, both git-ignored and read through Config/*.xcconfig.
targetTemplates:
  Configured:
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

targets:
  Clicker:
    type: application
    platform: iOS
    templates: [Configured]
    sources:
      - path: Clicker
        excludes:
          - "Info-macOS.plist"
          - "App/ClickerMacApp.swift"
          - "ClickerMac.entitlements"
    info:
      path: Clicker/Info.plist
      properties:
        CFBundleDisplayName: Clicker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Clicker finds and controls your TV over your home Wi‑Fi.
        NSBonjourServices:
          - _airplay._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ClickerSeedHost: $(CLICKER_SEED_HOST)
        ClickerSeedName: $(CLICKER_SEED_NAME)
        ClickerSeedModel: $(CLICKER_SEED_MODEL)
        ClickerSeedID: $(CLICKER_SEED_ID)
        ClickerSeedMAC: $(CLICKER_SEED_MAC)
        ClickerSeedToken: $(CLICKER_SEED_TOKEN)
        ClickerSeedHAURL: $(CLICKER_SEED_HA_URL)
        ClickerSeedHAEntity: $(CLICKER_SEED_HA_ENTITY)
        ClickerSeedHAToken: $(CLICKER_SEED_HA_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  ClickerMac:
    type: application
    platform: macOS
    templates: [Configured]
    sources:
      - path: Clicker
        excludes:
          - "Info.plist"
          - "App/ClickerApp.swift"
          - "ClickerMac.entitlements"
    info:
      path: Clicker/Info-macOS.plist
      properties:
        CFBundleDisplayName: Clicker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Clicker finds and controls your TV over your home network.
        NSBonjourServices:
          - _airplay._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ClickerSeedHost: $(CLICKER_SEED_HOST)
        ClickerSeedName: $(CLICKER_SEED_NAME)
        ClickerSeedModel: $(CLICKER_SEED_MODEL)
        ClickerSeedID: $(CLICKER_SEED_ID)
        ClickerSeedMAC: $(CLICKER_SEED_MAC)
        ClickerSeedToken: $(CLICKER_SEED_TOKEN)
        ClickerSeedHAURL: $(CLICKER_SEED_HA_URL)
        ClickerSeedHAEntity: $(CLICKER_SEED_HA_ENTITY)
        ClickerSeedHAToken: $(CLICKER_SEED_HA_TOKEN)
    entitlements:
      path: Clicker/ClickerMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Clicker
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKER_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: "YES"
      configs:
        # Local builds are signed to run on this Mac only; no Apple ID or profile needed, and they
        # never expire. Release keeps automatic signing for the Mac App Store.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
